<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>本機漫畫翻譯：設定</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 24px 16px 48px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; }
    .row input[type=text], .row select, .row input[type=number] { width: 280px; max-width: 60%; }
    textarea { width: 100%; height: 90px; resize: vertical; }
    .foot { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
<main>
  <h1>本機漫畫翻譯：設定</h1>
  <p class="hint">變更會立即儲存，已開啟翻譯的分頁會自動重新套用。</p>

  <h2>語言與引擎</h2>
  <label class="row"><span>原文語言</span><select id="sourceLang"></select></label>
  <label class="row"><span>譯文語言</span><select id="targetLang"></select></label>
  <label class="row"><span>翻譯引擎</span>
    <select id="engine">
      <option value="google">Google 翻譯（免金鑰，需連網）</option>
      <option value="ollama">Ollama（本機 LLM，完全離線）</option>
    </select>
  </label>
  <label class="row"><span>Ollama 模型</span><input type="text" id="ollamaModel" spellcheck="false"></label>
  <label class="row"><span>Ollama 位址</span><input type="text" id="ollamaUrl" spellcheck="false"></label>
  <label class="row"><span>本機伺服器位址</span><input type="text" id="serverUrl" spellcheck="false"></label>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">檢查連線…</span></div>

  <h2>文字外觀</h2>
  <label class="row"><span>字型</span><input type="text" id="fontFamily" spellcheck="false"></label>
  <label class="row"><span>字級上限倍率</span><input type="number" id="fontScale" min="0.5" max="2" step="0.1"></label>
  <label class="row"><span>粗體</span><input type="checkbox" id="bold"></label>
  <label class="row"><span>底色不透明度</span><input type="number" id="bgOpacity" min="0" max="1" step="0.05"></label>
  <label class="row"><span>直排文字</span>
    <select id="vertical">
      <option value="auto">自動（細長的對話框用直排）</option>
      <option value="off">一律橫排</option>
    </select>
  </label>

  <h2>圖片與網站</h2>
  <label class="row"><span>最小圖片邊長（像素）</span><input type="number" id="minSize" min="50" max="2000" step="10"></label>
  <label><span>自動翻譯的網站（每行一個網域）</span>
    <textarea id="autoSites" spellcheck="false"></textarea>
  </label>

  <div class="foot">
    <button id="reset">還原預設值</button>
    <span class="hint" id="saved"></span>
  </div>
</main>
<script src="defaults.js"></script>
<script src="options.js"></script>
</body>
</html>
